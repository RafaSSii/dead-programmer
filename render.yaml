databases:
  - name: dead-programmer-db
    databaseName: dead_programmer_db
    user: dead_programmer_db_user
    plan: free
    region: virginia

services:
  - type: web
    name: dead-programmer
    runtime: ruby
    plan: free
    region: virginia
    buildCommand: bundle install && bundle exec rails assets:precompile && bundle exec rails db:prepare
    startCommand: bundle exec puma -C config/puma.rb
    healthCheckPath: /up
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dead-programmer-db
          property: connectionString
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: RAILS_MAX_THREADS
        value: "3"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: BLOG_ADMIN_USER
        value: admin
      - key: BLOG_ADMIN_PASSWORD
        generateValue: true
      - key: BLOG_LOGIN_PATH
        generateValue: true
